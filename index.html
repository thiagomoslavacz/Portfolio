<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <!-- Meta Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts Link -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Englebert&family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Icons Link -->
    <link
      href="https://cdn.boxicons.com/3.0.5/fonts/basic/boxicons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css"
      rel="stylesheet"
    />

    <!-- CSS Link -->
    <link rel="stylesheet" href="css/style.css" />

    <!-- Title -->
    <title>Portfolio-Thiago-Moslavacz</title>
  </head>
  <body>
    <div class="bio">
      <span>Dev <span>/</span></span>
      <p class="name">Thiago Moslavacz</p>
      <div class="status">
        <span class="dot"></span>
        <p>Online</p>
      </div>
    </div>

    <nav id="sidebar">
      <div class="icon-wrapper selected" data-section="home">
        <i class="bxr bx-home"></i>
        <span class="tooltip">Home</span>
      </div>
      <div class="icon-wrapper" data-section="projects">
        <i class="bxr bx-dashboard"></i>
        <span class="tooltip">Projects</span>
      </div>
      <div class="icon-wrapper" data-section="skills">
        <i class="bxr bx-hot"></i>
        <span class="tooltip">Skills</span>
      </div>
      <div class="icon-wrapper" data-section="contact">
        <i class="bxr bx-envelope"></i>
        <span class="tooltip">Contact</span>
      </div>
    </nav>

    <div class="wrapper">
      <p><span>Coffee</span> Break?</p>
      <img src="assets/images/latte-icon.png" alt="Latte Icon" />
    </div>

    <section id="hero">
      <section class="page home active">
        <h1>
          Yes, I <span>code</span> and <span>build stuff!</span> <br />
          No, I'm not fixing your printer.
        </h1>
      </section>
      <section class="page projects">
        <h1>Selected <span>Projects</span></h1>
      </section>
      <section class="page skills">
        <h1>How <span>I Work</span></h1>
      </section>
      <section class="page contact">
        <h1><span>Get in</span> Touch</h1>
      </section>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
    <script src="js/script.js" defer></script>
  </body>
</html>
